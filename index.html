<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6b3908">

<title>کافه رستوران نجاتی</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

:root{
    --brown-dark:#4b2603;
    --brown:#673604;
    --brown-light:#7c4308;
    --gold:#e0a84d;
    --gold-light:#f0c36b;
}

body{
    background:linear-gradient(
        135deg,
        #5a2f05 0%,
        #704000 45%,
        #5b3005 100%
    );
    color:#fff;
    font-family:'Vazirmatn',sans-serif;
    min-height:100vh;
}

/* ================= TOPBAR ================= */

.topbar{
    position:fixed;
    top:0;
    right:0;
    left:0;
    height:74px;
    background:rgba(82,42,3,.96);
    border-bottom:1px solid rgba(255,211,130,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
    backdrop-filter:blur(12px);
}

.logo-box{
    position:absolute;
    right:50%;
    transform:translateX(50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.logo{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#f7eee0;
    border:3px solid var(--gold);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo-placeholder{
    color:#754005;
    font-size:8px;
    text-align:center;
    line-height:1.5;
}

.brand-name{
    margin-top:2px;
    font-size:9px;
    font-weight:800;
    color:#fff1d2;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    top:74px;
    right:0;
    bottom:0;
    width:82px;
    background:rgba(69,34,2,.96);
    border-left:1px solid rgba(255,220,150,.08);
    z-index:900;
    overflow-y:auto;
    scrollbar-width:none;
}

.sidebar::-webkit-scrollbar{
    display:none;
}

.category{
    width:100%;
    min-height:82px;
    border:0;
    border-bottom:1px solid rgba(255,255,255,.035);
    background:transparent;
    color:#fff;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    transition:.2s ease;
}

.category:hover{
    background:rgba(255,190,76,.08);
}

.category.active{
    background:linear-gradient(
        180deg,
        #804706,
        #6b3804
    );
    box-shadow:inset -3px 0 0 var(--gold);
}

.category-icon{
    width:35px;
    height:35px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.category-title{
    font-size:10px;
    font-weight:700;
    white-space:nowrap;
}

.category-en{
    font-family:Arial,sans-serif;
    font-size:7px;
    color:#bda075;
    direction:ltr;
}

/* ================= MAIN ================= */

.main{
    margin-right:82px;
    padding-top:74px;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:26px 28px 45px;
}

/* ================= TITLE ================= */

.page-title{
    width:100%;
    text-align:center;
    background:rgba(87,43,3,.78);
    border-radius:9px;
    border:1px solid rgba(255,220,150,.07);
    padding:8px;
    margin-bottom:19px;
}

.page-title h1{
    font-size:23px;
    font-weight:800;
    color:#fff8e8;
}

.page-title p{
    margin-top:4px;
    color:#c9a878;
    font-size:10px;
}

/* ================= SECTION ================= */

.menu-section{
    margin-bottom:29px;
}

.section-title{
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:rgba(83,41,2,.72);
    color:#fff6e4;
    font-size:19px;
    font-weight:800;
    margin-bottom:14px;
    border:1px solid rgba(255,220,150,.06);
}

/* ================= GRID ================= */

.menu-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

/* ================= NORMAL CARD ================= */

.menu-card{
    position:relative;
    min-height:135px;
    display:flex;
    flex-direction:row;
    overflow:hidden;
    border-radius:13px;
    background:linear-gradient(
        135deg,
        #774006,
        #683604
    );
    border:1px solid rgba(255,214,143,.07);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:transform .2s ease, background .2s ease;
}

.menu-card:hover{
    transform:translateY(-2px);
    background:linear-gradient(
        135deg,
        #824708,
        #703a05
    );
}

/* ================= NORMAL IMAGE ================= */

.food-image{
    width:120px;
    min-width:120px;
    height:135px;
    overflow:hidden;
    background:#492702;
}

.food-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .3s ease;
}

.menu-card:hover .food-image img{
    transform:scale(1.04);
}

/* ================= INFO ================= */

.food-info{
    flex:1;
    min-width:0;
    padding:15px 14px 12px;
    display:flex;
    flex-direction:column;
}

.food-name{
    color:#fff4df;
    font-size:17px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:6px;
}

.food-description{
    color:#d7bb91;
    font-size:10px;
    line-height:1.9;
    flex:1;
}

.food-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:8px;
}

.price{
    color:#fff4d6;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
}

.add-button{
    width:30px;
    height:30px;
    border:0;
    border-radius:7px;
    background:#4c2904;
    color:#fff;
    font-size:20px;
    line-height:30px;
    cursor:pointer;
}

.add-button:hover{
    background:var(--gold);
    color:#4d2803;
}

.add-button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

/* ================= BADGE ================= */

.badge{
    position:absolute;
    top:0;
    right:0;
    padding:5px 12px;
    background:#e53030;
    color:white;
    font-size:9px;
    border-radius:0 0 0 8px;
    z-index:3;
}

.badge.special{
    background:#dca33f;
    color:#432200;
}

/* ================= HOOKAH CARD ================= */
/* قلیان بدون عکس */

.hookah-card{
    position:relative;
    min-height:115px;
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
    border-radius:13px;
    padding:18px 22px;
    background:
        linear-gradient(
            135deg,
            #774006,
            #683604
        );
    border:1px solid rgba(255,214,143,.07);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    transition:transform .2s ease, background .2s ease;
}

.hookah-card:hover{
    transform:translateY(-2px);
    background:
        linear-gradient(
            135deg,
            #824708,
            #703a05
        );
}

.hookah-card .food-info{
    padding:0;
    width:100%;
}

.hookah-card .food-name{
    font-size:18px;
    margin-bottom:6px;
}

.hookah-card .food-description{
    font-size:10px;
    line-height:1.9;
}

.hookah-card .food-bottom{
    margin-top:12px;
}

.hookah-card .price{
    font-size:14px;
}

/* ================= INSTAGRAM ================= */

.instagram{
    margin:25px auto 0;
    max-width:400px;
    min-height:55px;
    border-radius:11px;
    background:rgba(77,38,2,.65);
    border:1px solid rgba(255,211,130,.1);
    color:#fff0d0;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.instagram-icon{
    font-size:22px;
    color:#e4ae59;
}

.instagram-text{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
}

.instagram-text strong{
    font-size:10px;
}

.instagram-text span{
    direction:ltr;
    font-size:10px;
    color:#d8b583;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#a78961;
    font-size:9px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#e0c49b;
    font-size:12px;
}

.error{
    text-align:center;
    padding:25px;
    color:#ffb0a8;
    background:rgba(180,30,20,.15);
    border-radius:10px;
    font-size:12px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .topbar{
        height:65px;
    }

    .main{
        margin-right:0;
        padding-top:141px;
    }

    .sidebar{
        top:65px;
        right:0;
        left:0;
        bottom:auto;
        width:100%;
        height:76px;
        display:flex;
        flex-direction:row;
        overflow-x:auto;
        overflow-y:hidden;
        border-left:0;
        border-bottom:1px solid rgba(255,220,150,.08);
    }

    .category{
        min-width:78px;
        width:78px;
        height:76px;
        min-height:76px;
        flex-shrink:0;
        border-bottom:0;
        border-left:1px solid rgba(255,255,255,.035);
    }

    .category.active{
        box-shadow:inset 0 -3px 0 var(--gold);
    }

    .category-icon{
        width:30px;
        height:30px;
        font-size:21px;
    }

    .category-title{
        font-size:9px;
    }

    .category-en{
        font-size:6px;
    }

    .container{
        padding:16px 10px 35px;
    }

    .page-title h1{
        font-size:20px;
    }

    .section-title{
        font-size:17px;
    }

    .menu-grid{
        grid-template-columns:1fr;
        gap:10px;
    }

    .menu-card{
        min-height:116px;
    }

    .food-image{
        width:105px;
        min-width:105px;
        height:116px;
    }

    .food-info{
        padding:11px;
    }

    .food-name{
        font-size:14px;
    }

    .food-description{
        font-size:9px;
        line-height:1.7;
    }

    .price{
        font-size:11px;
    }

    /* قلیان در موبایل */
    .hookah-card{
        min-height:105px;
        padding:15px;
    }

    .hookah-card .food-info{
        padding:0;
    }

    .hookah-card .food-name{
        font-size:15px;
    }

    .hookah-card .food-description{
        font-size:9px;
    }

    .hookah-card .price{
        font-size:12px;
    }
}

@media(max-width:380px){

    .category{
        min-width:72px;
        width:72px;
    }

    .food-image{
        width:92px;
        min-width:92px;
    }

    .food-name{
        font-size:13px;
    }

    .hookah-card .food-name{
        font-size:14px;
    }
}

</style>
</head>

<body>

<!-- ================= TOPBAR ================= -->

<header class="topbar">

    <div class="logo-box">

        <div class="logo">

            <img
                src="images/logo.jpg"
                alt="لوگوی کافه رستوران نجاتی"
                onerror="

<!-- ================= MAIN ================= -->

<main class="main">

<div class="container">

    <div class="page-title">
        <h1>کافه رستوران نجاتی</h1>

        <div class="section-title">نوشیدنی سرد</div>

        <div class="section-title">دسر</div>

    <a
        class="instagram"
        href="https://instagram.com/nejatieh_cafe"
        target="_blank"
        rel="noopener noreferrer"
    >

            ◎
        </div>

            <strong>
                اینستاگرام کافه رستوران نجاتی
            </strong>

            <span>

            </span>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://hblvegxugacixftvgzfw.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aT7GnSh-NSbrX6Rbksoe5g_RzyI4LEO";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CATEGORY MAP
===================================================== */

const categoryMap = {

    food:{
        title:"غذای اصلی"
    },

    fastfood:{
        title:"فست‌فود"
    },

    breakfast:{
        title:"صبحانه"
    },

    pizza:{
        title:"پیتزا"
    },

    hot:{
        title:"نوشیدنی گرم"
    },

    cold:{
        title:"نوشیدنی سرد"
    },

    dessert:{
        title:"دسر"
    },

    hookah:{
        title:"قلیان"
    }

};


/* =====================================================
   NAVIGATION
===================================================== */

function showCategory(id,button){

    const target =
        document.getElementById(id);

    if(!target) return;

    const offset =
        window.innerWidth <= 700
        ? 150
        : 90;

    const position =
        target.getBoundingClientRect().top +
        window.pageYOffset -
        offset;

    window.scrollTo({
        top:position,
        behavior:"smooth"
    });

    document
        .querySelectorAll(".category")
        .forEach(function(btn){

            btn.classList.remove("active");

        });

    if(button){

        button.classList.add("active");

    }

}


/* =====================================================
   LOAD MENU
===================================================== */

async function loadMenu(){

    const grids =
        document.querySelectorAll(".menu-grid");

    grids.forEach(function(grid){

        grid.innerHTML =
            '<div class="loading">در حال دریافت منو...</div>';

    });


    console.log("Connecting to Supabase...");


    const {
        data,
        error
    } =
    await supabaseClient
        .from("menu_items")
        .select(`
            id,
            category_id,
            name,
            description,
            price,
            badge,
            image_url,
            is_available,
            sort_order,
            categories (
                id,
                title
            )
        `)
        .order(
            "sort_order",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "SUPABASE ERROR:",
            error
        );

        grids.forEach(function(grid){

            grid.innerHTML = `

                <div class="error">

                    دریافت اطلاعات منو با مشکل مواجه شد.

                    <br><br>

                    خطای Supabase:

                    <br>

                    ${escapeHTML(error.message)}

                </div>

            `;

        });

        return;

    }


    console.log(
        "MENU DATA:",
        data
    );


    if(!data || data.length === 0){

        grids.forEach(function(grid){

            grid.innerHTML =
                '<div class="loading">هنوز آیتمی در منو ثبت نشده است.</div>';

        });

        return;

    }


    /* =================================================
       DATABASE CATEGORY → SITE CATEGORY
    ================================================= */

    const categories = {

        "غذای اصلی":"food",

        "فست‌فود":"fastfood",

        "فست فود":"fastfood",

        "صبحانه":"breakfast",

        "پیتزا":"pizza",

        "نوشیدنی گرم":"hot",

        "نوشیدنی سرد":"cold",

        "دسر":"dessert",

        "قلیان":"hookah"

    };


    /* خالی کردن بخش‌ها */

    Object.keys(categoryMap).forEach(function(category){

        const section =
            document.getElementById(category);

        if(!section) return;

        const grid =
            section.querySelector(".menu-grid");

        if(grid){

            grid.innerHTML = "";

        }

    });


    /* =================================================
       نمایش آیتم‌ها
    ================================================= */

    data.forEach(function(item){

        if(item.is_available === false){

            return;

        }


        const categoryTitle =
            item.categories &&
            item.categories.title
            ? item.categories.title.trim()
            : "";


        const categoryId =
            categories[categoryTitle];


        console.log(
            "ITEM:",
            item.name,
            "CATEGORY:",
            categoryTitle,
            "SITE CATEGORY:",
            categoryId
        );


        if(!categoryId){

            console.warn(
                "دسته‌بندی ناشناخته:",
                categoryTitle,
                item
            );

            return;

        }


        const section =
            document.getElementById(categoryId);

        if(!section) return;


        const grid =
            section.querySelector(".menu-grid");

        if(!grid) return;


        /* قلیان بدون عکس */

        if(categoryId === "hookah"){

            createHookahCard(
                item,
                grid
            );

        }else{

            createMenuCard(
                item,
                grid
            );

        }

    });


    /* =================================================
       بخش‌های خالی
    ================================================= */

    Object.keys(categoryMap).forEach(function(category){

        const section =
            document.getElementById(category);

        if(!section) return;

        const grid =
            section.querySelector(".menu-grid");

        if(!grid) return;

        if(grid.children.length === 0){

            grid.innerHTML =
                '<div class="loading">فعلاً آیتمی در این بخش ثبت نشده است.</div>';

        }

    });

}


/* =====================================================
   CREATE NORMAL CARD
===================================================== */

function createMenuCard(item,grid){

    const card =
        document.createElement("article");

    card.className =
        "menu-card";


    /* Badge */

    let badgeHTML = "";

    if(item.badge){

        const special =
            item.badge.trim() === "ویژه"
            ? "special"
            : "";

        badgeHTML = `

            <span class="badge ${special}">

                ${escapeHTML(item.badge)}

            </span>

        `;

    }


    /* Image */

    const image =
        item.image_url &&
        String(item.image_url).trim() !== ""
        ? item.image_url
        : "images/no-image.jpg";


    /* Price */

    const price =
        Number(item.price || 0)
        .toLocaleString("fa-IR");


    card.innerHTML = `

        ${badgeHTML}

        <div class="food-image">

            <img
                src="${escapeAttribute(image)}"
                alt="${escapeAttribute(item.name || "")}"
                loading="lazy"
                onerror="this.src='images/no-image.jpg';"
            >

        </div>


        <div class="food-info">

            <h3 class="food-name">

                ${escapeHTML(item.name || "")}

            </h3>


            <p class="food-description">

                ${escapeHTML(item.description || "")}

            </p>


            <div class="food-bottom">

                <span class="price">

                    ${price} تومان

                </span>


                <button
                    class="add-button"
                    aria-label="افزودن"
                >

                    +

                </button>

            </div>

        </div>

    `;


    grid.appendChild(card);

}

/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   ACTIVE CATEGORY ON SCROLL
===================================================== */

const sections =
    document.querySelectorAll(".menu-section");


const categoryButtons =
    document.querySelectorAll(".category");


const indexMap = {

    food:0,
    fastfood:1,
    breakfast:2,
    pizza:3,
    hot:4,
    cold:5,
    dessert:6,
    hookah:7

};


window.addEventListener(
    "scroll",
    function(){

        let current = "";

        sections.forEach(
            function(section){

                const top =
                    section.offsetTop;

                if(
                    window.pageYOffset >=
                    top - 180
                ){

                    current =
                        section.id;

                }

            }
        );


        categoryButtons.forEach(
            function(button){

                button.classList.remove(
                    "active"
                );

            }
        );


        if(
            current &&
            indexMap[current] !== undefined
        ){

            categoryButtons[
                indexMap[current]
            ].classList.add(
                "active"
            );

        }

    }
);
